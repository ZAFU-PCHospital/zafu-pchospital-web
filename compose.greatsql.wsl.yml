# 本地 WSL 开发专用，独立于服务器使用的 compose.greatsql.yml。
name: zafu-pchospital-wsl

services:
  greatsql:
    image: registry.cn-beijing.aliyuncs.com/greatsql/greatsql:8.0.32-27
    restart: unless-stopped
    # 原生 WSL 的 NUMA 初始化需要此能力（兼容 WSL 3.x）。
    cap_add:
      - SYS_NICE
    environment:
      TZ: UTC
      MYSQL_ROOT_PASSWORD: local-root-change-me
      MYSQL_DATABASE: zafu_pchospital
      MYSQL_USER: app_user
      MYSQL_PASSWORD: change-me
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - greatsql-data:/data/GreatSQL
    healthcheck:
      test:
        ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h 127.0.0.1 -uroot -Nse 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  greatsql-data:
