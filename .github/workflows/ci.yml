# 官网构建与站内文档的持续集成
#
# 为什么需要它：仓库此前**没有任何 CI**，而「lint/build 必须通过」只写在文档里，
# 合并前没有任何机器检查。站内文档集成（/tools → /handbook/）尤其容易漏：
# 只跑 pnpm build:site 也能「构建成功」，但 /handbook/ 会整片 404，
# 而本仓库**没有配置部署前的任何拦截**。这个 workflow 就是那道拦截。
#
# 触发：
#   - pull_request → main：改动进 main 之前先验一遍
#   - push → main：合并后再验一遍
#   - workflow_dispatch：手动触发，可选文档仓库版本
#
# 本 workflow 只校验与构建，**不执行部署**：生产发布由维护者在本地用
# tools/deploy/deploy-prod.sh 完成（含备份、迁移核对、原子切换与回滚）。
#
# 仓库侧设置（不在代码里，见 AGENTS.md 第 11 节）：
#   - main 的保护已生效：仓库 ruleset「default」要求所有改动走 PR，并把本 workflow 的
#     「校验与构建」设为必需状态检查（同时禁止强推与删除），所以直接 push main 会被拒绝。
#   - 可选：设置仓库变量 DOCS_REF 指定文档仓库分支（默认 main）。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      docs_ref:
        description: 文档仓库的分支/标签（留空则用仓库变量 DOCS_REF，再否则 main）
        required: false
        type: string

# 同一分支上新的推送取消上一次未完成的运行，避免排队堆积
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # mdBook 版本固定，不用 latest —— 构建产物要可复现（manifest 里记录了文档版本，
  # 若 mdBook 版本漂移，产出的 HTML 也可能变）。升级时改这一处。
  MDBOOK_VERSION: v0.5.4
  DOCS_REPO: ZAFU-PCHospital/ZAFU-PCHospital-Doc

jobs:
  verify:
    name: 校验与构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出官网仓库
        uses: actions/checkout@v4
        with:
          path: .

      - name: 确定文档版本
        id: docs
        env:
          DOCS_REF: ${{ inputs.docs_ref || vars.DOCS_REF || 'main' }}
        run: |
          set -euo pipefail
          sha=$(git ls-remote "https://github.com/${DOCS_REPO}.git" "refs/heads/${DOCS_REF}" | cut -f1)
          if [ -z "${sha}" ]; then
            echo "::error::文档仓库 ${DOCS_REPO} 上找不到分支 ${DOCS_REF}"
            exit 1
          fi
          echo "文档版本：${DOCS_REPO} ${DOCS_REF} → ${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: 检出文档仓库到 .docs-source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DOCS_REPO }}
          ref: ${{ steps.docs.outputs.sha }}
          path: .docs-source
          fetch-depth: 1

      # 固定版本、官方 release 二进制：不依赖第三方 action，与本地开发者的做法一致
      # （AGENTS.md 第 7 节也是让开发者下载 release 二进制）。
      - name: 安装 mdBook（固定版）
        run: |
          set -euo pipefail
          url="https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" -o /tmp/mdbook.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/mdbook.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mdbook" --version | grep -F "${MDBOOK_VERSION#v}" \
            || { echo "::error::mdBook 版本与固定的 ${MDBOOK_VERSION} 不一致"; exit 1; }

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        # minimumReleaseAge 在 pnpm-workspace.yaml 中统一设为 0，确保后续 lint/build
        # 等每条 pnpm 命令都不会再次启用新包等待期。
        run: pnpm install --frozen-lockfile

      - name: 校验表格能力清单
        run: pnpm table:capabilities

      # 依赖漏洞审计：**先只警告，不阻断**。
      # 首次接入就发现 5 个 high / 6 个 moderate（mariadb、mysql2、postcss、deepmerge-ts、uuid），
      # 其中多数只差一个补丁版本 —— 但这些包升级要单独验证，不能让它们把每个 PR 都卡住。
      # 观察一段时间后再决定是否收紧，或改成「只对 high/critical 阻断」。
      - name: 依赖漏洞审计（不阻断）
        run: |
          set -uo pipefail
          pnpm audit --audit-level=high || {
            echo "::warning::pnpm audit 报出 high/critical 级别的依赖漏洞，详见本步骤输出。"
            echo "::warning::本步骤刻意不阻断构建；请把它当成待办清单，按 GHSA 链接评估后再升级。"
          }

      # pnpm lint = ESLint + 主题调色板一致性校验
      - name: 检查（lint + 调色板一致性）
        run: pnpm lint

      # 部署脚本的本地替身测试：不连生产、不访问网络，覆盖网络失败切 bundle、
      # 纯代码跳过数据库阶段、历史待应用迁移、schema 无迁移中止、失败退出码与
      # docs-sync 定时器恢复、通知记录隔离。
      - name: 部署脚本检查与本地替身测试
        run: |
          set -euo pipefail
          bash -n tools/deploy/deploy-prod.sh
          bash -n tools/deploy/notify-result.sh
          bash -n tools/backup/backup.sh
          PYTHON_BIN="$(command -v python3 || command -v python)"
          "$PYTHON_BIN" -B -m unittest discover -s tests/deploy -v

      # 完整构建：文档 + 官网。不要用 build:site 代替 —— 那会产出缺 /handbook/ 的站点。
      - name: 完整构建（文档 + 官网）
        env:
          DOCS_SHA: ${{ steps.docs.outputs.sha }}
        run: pnpm build

      - name: 校验构建产物
        run: |
          set -euo pipefail
          test -f public/handbook/index.html                 || { echo "::error::缺少 public/handbook/index.html"; exit 1; }
          test -n "$(find public/handbook -name 'searchindex*' -print -quit)"   || { echo "::error::文档产物缺少 searchindex"; exit 1; }
          test -n "$(find public/handbook -name 'pc-hospital*.css' -print -quit)" || { echo "::error::文档产物缺少官网主题 CSS"; exit 1; }
          test -n "$(find public/handbook -name 'pc-hospital*.js' -print -quit)"  || { echo "::error::文档产物缺少官网主题 JS"; exit 1; }
          node -e '
            const m = require("./src/data/doc-manifest.json");
            if (!m?.tree?.length || !m?.meta?.counts) { console.error("::error::doc-manifest.json 结构异常"); process.exit(1); }
            console.log("清单：", JSON.stringify(m.meta.counts), "revision=" + m.meta.sourceRevision);
          '

      # 生产服务冒烟：证明"部署出去的产物"真的能访问到站内文档，
      # 而不只是磁盘上有文件。这类问题（构建成功但 URL 404）正是本次要防的。
      - name: 冒烟测试（生产服务访问站内文档）
        run: |
          set -euo pipefail
          pnpm start --port 3311 > /tmp/next-start.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT

          ready=""
          for _ in $(seq 1 40); do
            if curl -fsS -o /dev/null "http://127.0.0.1:3311/tools"; then ready="yes"; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then echo "::error::生产服务未在 40s 内就绪"; cat /tmp/next-start.log; exit 1; fi

          for path in / /about /join /tools /handbook/ /handbook/index.html; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L "http://127.0.0.1:3311${path}")
            echo "${path} → ${code}"
            [ "$code" = "200" ] || { echo "::error::${path} 返回 ${code}"; exit 1; }
          done

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: site-with-handbook
          path: |
            .next
            public/handbook
          retention-days: 3
