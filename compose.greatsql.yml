services:
  greatsql:
    image: greatsql/greatsql:8.0.32-27
    restart: unless-stopped
    environment:
      TZ: UTC
      MYSQL_ROOT_PASSWORD: local-root-change-me
      MYSQL_DATABASE: zafu_pchospital
      MYSQL_USER: app_user
      MYSQL_PASSWORD: change-me
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "3307:3306"
    volumes:
      - greatsql-data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h 127.0.0.1 -uroot -Nse 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  greatsql-data:
